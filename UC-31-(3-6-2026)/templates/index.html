<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f4c81, #3a86ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container{
            width: 100%;
            max-width: 450px;
        }

        h1{
            text-align: center;
            color: white;
            margin-bottom: 25px;
            font-size: 2rem;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        form{
            background: rgba(255,255,255,0.98);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        input{
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid #dbe8ff;
            border-radius: 10px;
            font-size: 15px;
            background-color: #f8fbff;
            transition: 0.3s;
        }

        input:focus{
            outline: none;
            border-color: #3a86ff;
            background: white;
            box-shadow: 0 0 0 4px rgba(58,134,255,0.15);
        }

        button{
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #0d6efd, #3a86ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(13,110,253,0.35);
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Cadastro de Alunos</h1>

    <form action="/cadastro" method="POST">

        <input type="text" name="nome" placeholder="Nome Completo" required>

        <input type="email" name="email" placeholder="E-mail" required>

        <input type="text" name="telefone" placeholder="Telefone" required>

        <input type="text" name="cpf" placeholder="CPF" required>

        <input type="text" name="cidade" placeholder="Cidade" required>

        <input type="text" name="estado" placeholder="Estado (CE, SP, RJ...)" required>

        <input type="text" name="curso" placeholder="Curso" required>

        <input type="number" name="idade" placeholder="Idade" required>

        <input type="password" name="senha" placeholder="Senha" required>

        <button type="submit">Cadastrar</button>

    </form>

</div>

</body>
</html>
