<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Preferências do Usuário</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="{{ tema }}">

    <div class="container">

        <h1>Projeto Flask com Cookies</h1>

        {% if nome %}
            <h2>Olá, {{ nome }}! 💙</h2>
        {% else %}
            <h2>Bem-vindo visitante!</h2>
        {% endif %}

        <form action="/salvar_nome" method="POST">
            <input
                type="text"
                name="nome"
                placeholder="Digite seu nome"
                required>

            <button type="submit">
                Salvar Nome
            </button>
        </form>

        <div class="temas">
            <a href="/trocar_tema/claro">
                Tema Claro
            </a>

            <a href="/trocar_tema/escuro">
                Tema Escuro
            </a>
        </div>

    </div>

</body>
</html>
